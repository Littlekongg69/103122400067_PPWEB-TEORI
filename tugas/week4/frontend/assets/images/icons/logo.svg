<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Hexagonal bio-shield -->
  <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" stroke="url(#logo-grad)" stroke-width="2" fill="#18221e" fill-opacity="0.9"/>
  <!-- Habitat grid -->
  <path d="M4 11 L36 11 M4 29 L36 29 M20 2 L20 38" stroke="#2d3f37" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Central sprout -->
  <path d="M20 28 C20 22 14 18 11 16 C16 16 20 20 20 28 Z" fill="url(#logo-grad)"/>
  <path d="M20 28 C20 20 26 15 29 13 C26 15 22 20 20 28 Z" fill="url(#glow-grad)"/>
  <!-- Circuit node -->
  <circle cx="20" cy="14" r="2.5" fill="#38bdf8"/>
  <circle cx="20" cy="14" r="5" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
</svg>
